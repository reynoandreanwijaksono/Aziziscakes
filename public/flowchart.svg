<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400">
  <defs>
    <style>
      .box { fill:#fff; stroke:#2b6cb0; stroke-width:2; rx:8; }
      .text { font-family: Arial, Helvetica, sans-serif; fill:#0f172a; font-size:16px; }
      .title { font-size:20px; font-weight:700; }
      .arrow { stroke:#4b5563; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" />
  <text x="40" y="48" class="text title">Flowchart: Pembuatan Website</text>

  <!-- Nodes -->
  <g id="start">
    <ellipse cx="600" cy="110" rx="90" ry="28" class="box" style="fill:#e6fffa;stroke:#00897b;"/>
    <text x="600" y="116" text-anchor="middle" class="text">Mulai</text>
  </g>

  <g id="req">
    <rect x="360" y="170" width="480" height="56" class="box"/>
    <text x="600" y="206" text-anchor="middle" class="text">1. Kumpulkan tujuan & requirement</text>
  </g>

  <g id="spec">
    <rect x="360" y="250" width="480" height="56" class="box"/>
    <text x="600" y="286" text-anchor="middle" class="text">Spesifikasi & scope</text>
  </g>

  <g id="design">
    <rect x="360" y="330" width="480" height="56" class="box"/>
    <text x="600" y="366" text-anchor="middle" class="text">2. Desain UI/UX & prototyping</text>
  </g>

  <g id="approve">
    <polygon points="520,420 680,420 720,468 680,516 520,516 480,468" class="box" style="stroke:#b45309;fill:#fff7ed"/>
    <text x="600" y="462" text-anchor="middle" class="text">Desain disetujui?</text>
  </g>

  <g id="env">
    <rect x="360" y="580" width="480" height="56" class="box"/>
    <text x="600" y="616" text-anchor="middle" class="text">3. Siapkan lingkungan development</text>
  </g>

  <g id="frontend">
    <rect x="80" y="700" width="460" height="56" class="box"/>
    <text x="310" y="736" text-anchor="middle" class="text">4. Implementasi Frontend</text>
  </g>

  <g id="backend">
    <rect x="660" y="700" width="460" height="56" class="box"/>
    <text x="890" y="736" text-anchor="middle" class="text">5. Implementasi Backend & Database</text>
  </g>

  <g id="api">
    <rect x="360" y="820" width="480" height="56" class="box"/>
    <text x="600" y="856" text-anchor="middle" class="text">6. Integrasi & API</text>
  </g>

  <g id="test">
    <rect x="360" y="900" width="480" height="56" class="box"/>
    <text x="600" y="936" text-anchor="middle" class="text">7. Pengujian (unit / integrasi / acceptance)</text>
  </g>

  <g id="pass">
    <polygon points="520,1000 680,1000 720,1048 680,1096 520,1096 480,1048" class="box" style="stroke:#16a34a;fill:#ecfdf5"/>
    <text x="600" y="1042" text-anchor="middle" class="text">Lulus pengujian?</text>
  </g>

  <g id="fix">
    <rect x="80" y="1140" width="460" height="56" class="box"/>
    <text x="310" y="1176" text-anchor="middle" class="text">Perbaikan / Bugfix</text>
  </g>

  <g id="deploy">
    <rect x="360" y="1220" width="480" height="56" class="box"/>
    <text x="600" y="1256" text-anchor="middle" class="text">8. Deployment ke production</text>
  </g>

  <g id="monitor">
    <rect x="360" y="1300" width="480" height="56" class="box"/>
    <text x="600" y="1336" text-anchor="middle" class="text">9. Monitoring & Maintenance</text>
  </g>

  <!-- Arrows -->
  <path d="M600 138 L600 170" class="arrow" />
  <path d="M600 226 L600 250" class="arrow" />
  <path d="M600 306 L600 330" class="arrow" />
  <path d="M600 390 L600 420" class="arrow" />
  <path d="M600 516 L600 580" class="arrow" />
  <path d="M420 636 L420 700" class="arrow" />
  <path d="M780 636 L780 700" class="arrow" />
  <path d="M420 756 L480 820" class="arrow" />
  <path d="M780 756 L720 820" class="arrow" />
  <path d="M600 876 L600 900" class="arrow" />
  <path d="M600 962 L600 1000" class="arrow" />
  <path d="M520 1096 L520 1140" class="arrow" />
  <path d="M520 1200 L520 1220" class="arrow" />
  <path d="M600 1280 L600 1300" class="arrow" />

  <!-- Loop back for failed tests -->
  <path d="M480 1100 C420 1180, 420 1180, 420 1180 L420 756" class="arrow" />

  <text x="40" y="1400" class="text" fill="#475569">Generated: static flowchart — simpan di public/flowchart.svg</text>
</svg>